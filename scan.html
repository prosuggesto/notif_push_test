<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggesto — Bienvenue</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .scan-card {
            text-align: center;
            max-width: 420px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 32px;
        }
        .club-name {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #8b5cf6;
            margin-bottom: 24px;
            font-weight: 700;
        }
        .scan-icon {
            font-size: 64px;
            margin-bottom: 24px;
            display: block;
        }
        .scan-title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .scan-desc {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .btn-signup {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 32px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-signup:active { transform: scale(0.97); }
        .already-member {
            margin-top: 24px;
            font-size: 14px;
            color: #64748b;
        }
        .already-member a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }
        .success-msg {
            display: none;
            text-align: center;
        }
        .success-msg .check {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .success-msg h2 {
            font-size: 24px; margin-bottom: 12px;
        }
        .success-msg p {
            color: #94a3b8; font-size: 15px; line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="scan-card">
        <!-- Initial CTA -->
        <div id="scan-cta">
            <div class="club-name" id="scan-club-name"></div>
            <span class="scan-icon">🎉</span>
            <h1 class="scan-title">Inscris-toi pour obtenir des réductions épiques</h1>
            <p class="scan-desc">Rejoins le programme de fidélité et cumule des points à chaque soirée pour débloquer des rewards exclusifs !</p>
            <button class="btn-signup" id="btn-scan-signup" onclick="handleScanSignup()">
                Je m'inscris
            </button>
            <p class="already-member">Déjà membre ? <a href="auth.html">Connecte-toi</a></p>
        </div>

        <!-- Success message -->
        <div id="scan-success" class="success-msg">
            <div class="check">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h2>Bienvenue !</h2>
            <p>Ton entrée a été validée. Crée ton compte pour retrouver tes points et profiter de tes rewards.</p>
            <button class="btn-signup" onclick="window.location.href='auth.html?action=signup'" style="margin-top: 24px;">
                Créer mon compte
            </button>
        </div>
    </div>

    <script>
        // Get club name from URL params
        const params = new URLSearchParams(window.location.search);
        const clubName = params.get('club') || 'Ce club';
        document.getElementById('scan-club-name').textContent = clubName;

        async function handleScanSignup() {
            const btn = document.getElementById('btn-scan-signup');
            btn.disabled = true;
            btn.textContent = 'Envoi en cours...';

            try {
                await fetch('https://n8n.srv862127.hstgr.cloud/webhook/entree_barre', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'entree_barre',
                        value: 'entree_barre.01',
                        club_name: clubName,
                        increment: 1
                    })
                });
            } catch (e) {
                console.error('Webhook error:', e);
            }

            // Show success
            document.getElementById('scan-cta').style.display = 'none';
            document.getElementById('scan-success').style.display = 'block';
        }
    </script>
</body>
</html>
